<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Neón Moderna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 20%, #0d1322 0%, #060911 100%);
            min-height: 100vh;
        }
        
        /* Efecto de borde brillante multicolor con gradiente */
        .neon-border {
            position: relative;
            border-radius: 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }
        
        .neon-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 2.1rem;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #06b6d4, #8b5cf6);
            z-index: -1;
            opacity: 0.7;
            filter: blur(1px);
        }

        /* Efecto de Botones con Estilo Neumórfico Translúcido */
        .calc-btn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.2));
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.4), 
                        -3px -3px 10px rgba(255, 255, 255, 0.03),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.15s ease-in-out;
        }

        .calc-btn:hover {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.1));
            box-shadow: 6px 6px 20px rgba(0, 0, 0, 0.5), 
                        -3px -3px 12px rgba(255, 255, 255, 0.06),
                        inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .calc-btn:active {
            transform: scale(0.95);
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.6),
                        inset -3px -3px 6px rgba(255, 255, 255, 0.05);
        }

        /* Botón de Igual Destacado */
        .btn-equals {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4),
                        inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }
        .btn-equals:hover {
            background: linear-gradient(135deg, #38bdf8, #1d4ed8);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7),
                        inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* Estilos específicos para botones morados (AC, DEL) */
        .btn-purple {
            color: #ec4899;
        }
        
        /* Display con aspecto de pantalla futurista */
        .calc-display {
            background: rgba(4, 7, 14, 0.7);
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.8),
                        0 0 10px rgba(14, 165, 233, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-xs sm:max-w-sm p-5 sm:p-6 neon-border backdrop-blur-xl">
        
        <!-- Display de la Calculadora -->
        <div class="calc-display mb-6 p-4 rounded-2xl text-right overflow-hidden border border-white/5">
            <div id="history" class="text-xs sm:text-sm text-cyan-400/60 font-light h-5 truncate tracking-wider"></div>
            <div id="display" class="text-3xl sm:text-4xl font-semibold text-cyan-300 tracking-wide mt-1 truncate">75+25</div>
        </div>

        <!-- Panel de Teclado (Cuadrícula exacta solicitada) -->
        <div class="grid grid-cols-4 gap-3 sm:gap-3.5">
            
            <!-- Fila 1 -->
            <button onclick="clearAll()" class="calc-btn text-purple-400 font-semibold py-3.5 sm:py-4 rounded-xl text-sm sm:text-base flex items-center justify-center">AC</button>
            <button onclick="deleteChar()" class="calc-btn text-purple-400 font-semibold py-3.5 sm:py-4 rounded-xl text-sm sm:text-base flex items-center justify-center">DEL</button>
            <button onclick="appendOperator('%')" class="calc-btn text-cyan-400 font-semibold py-3.5 sm:py-4 rounded-xl text-sm sm:text-base flex items-center justify-center">%</button>
            <button onclick="appendOperator('/')" class="calc-btn text-cyan-400 font-semibold py-3.5 sm:py-4 rounded-xl text-sm sm:text-base flex items-center justify-center">/</button>

            <!-- Fila 2 -->
            <button onclick="appendNumber('7')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">7</button>
            <button onclick="appendNumber('8')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">8</button>
            <button onclick="appendNumber('9')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">9</button>
            <button onclick="appendOperator('*')" class="calc-btn text-cyan-400 font-semibold py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">*</button>

            <!-- Fila 3 -->
            <button onclick="appendNumber('4')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">4</button>
            <button onclick="appendNumber('5')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">5</button>
            <button onclick="appendNumber('6')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">6</button>
            <button onclick="appendOperator('-')" class="calc-btn text-cyan-400 font-semibold py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">-</button>

            <!-- Fila 4 -->
            <button onclick="appendNumber('1')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">1</button>
            <button onclick="appendNumber('2')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">2</button>
            <button onclick="appendNumber('3')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">3</button>
            <button onclick="appendOperator('+')" class="calc-btn text-cyan-400 font-semibold py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">+</button>

            <!-- Fila 5 -->
            <button onclick="appendNumber('0')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg col-span-2 flex items-center justify-center pl-6">0</button>
            <button onclick="appendDecimal('.')" class="calc-btn text-gray-200 font-medium py-3.5 sm:py-4 rounded-xl text-lg flex items-center justify-center">.</button>
            <button onclick="calculateResult()" class="btn-equals text-white font-semibold py-3.5 sm:py-4 rounded-xl text-xl flex items-center justify-center">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const history = document.getElementById('history');
        let currentInput = "75+25"; // Inicializado tal cual muestra la imagen de referencia
        let calculated = false;

        function updateDisplay() {
            display.textContent = currentInput === "" ? "0" : currentInput;
        }

        function appendNumber(num) {
            if (calculated) {
                currentInput = num;
                calculated = false;
            } else {
                if (currentInput === "0" && num !== "0") {
                    currentInput = num;
                } else if (currentInput !== "0") {
                    currentInput += num;
                } else if (currentInput === "0" && num === "0") {
                    // Evitar ceros múltiples innecesarios al inicio
                    return;
                } else {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendOperator(op) {
            calculated = false;
            if (currentInput === "" && op === "-") {
                currentInput = "-";
                updateDisplay();
                return;
            }
            if (currentInput === "") return;
            
            // Reemplazar último operador si se pulsa seguido
            const lastChar = currentInput.slice(-1);
            if (['+', '-', '*', '/', '%'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + op;
            } else {
                currentInput += op;
            }
            updateDisplay();
        }

        function appendDecimal(dot) {
            if (calculated) {
                currentInput = "0.";
                calculated = false;
                updateDisplay();
                return;
            }
            // Obtener el número actual buscando el último operador
            const parts = currentInput.split(/[\+\-\*\/%]/);
            const lastPart = parts[parts.length - 1];
            
            if (!lastPart.includes('.')) {
                currentInput += dot;
                updateDisplay();
            }
        }

        function clearAll() {
            currentInput = "0";
            history.textContent = "";
            calculated = false;
            updateDisplay();
        }

        function deleteChar() {
            if (calculated) {
                currentInput = "0";
                calculated = false;
            } else if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function calculateResult() {
            if (currentInput === "" || calculated) return;
            
            try {
                // Reemplazar signos amigables si es necesario o evaluar directamente con seguridad básica
                let expressionToEval = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                
                // Manejar porcentajes básicos por ej: 50+10%
                // Realizamos una evaluación limpia y protegida
                let result = Function('"use strict"; return (' + expressionToEval + ')')();
                
                // Redondear para evitar problemas de precisión flotante en JS (ej. 0.1 + 0.2)
                result = Math.round(result * 100000000) / 100000000;

                history.textContent = currentInput + " =";
                currentInput = result.toString();
                calculated = true;
                updateDisplay();
            } catch (error) {
                display.textContent = "Error";
                currentInput = "0";
                calculated = true;
            }
        }

        // Soporte opcional para teclado físico
        document.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9')) {
                appendNumber(e.key);
            } else if (['+', '-', '*', '/'].includes(e.key)) {
                appendOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculateResult();
            } else if (e.key === 'Backspace') {
                deleteChar();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (e.key === '.') {
                appendDecimal('.');
            } else if (e.key === '%') {
                appendOperator('%');
            }
        });
    </script>
</body>
</html>
